[package]
name = "envlume-clients"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
envlume-workspace.workspace = true
envlume-application.workspace = true
envlume-domain.workspace = true
envlume-storage.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml_edit = "0.25"
sha2 = "0.10"
cap-std = "4"
cap-fs-ext = "4"
rmcp = { version = "3.11.0", default-features = false, features = ["client","transport-async-rw"] }
tokio = { version="1", features=["rt","time","process"] }

[target.'cfg(unix)'.dependencies]
libc="0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version="0.61", features=["Win32_Foundation","Win32_Security_Authorization","Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile="3"
