[package]
name = "envlume-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
envlume-application.workspace = true
envlume-domain.workspace = true
envlume-toolchain.workspace = true
envlume-workspace.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"
url = "2"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "11", default-features = false, features = ["std", "job-object", "kill-on-drop"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_System_Console","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp","Win32_System_SystemInformation","Win32_System_Pipes","Win32_Storage_FileSystem"] }
