[package]
name = "envlume-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
envlume-audit.workspace = true
envlume-workspace.workspace = true
envlume-application.workspace = true
envlume-domain.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
semver = "1"
dirs = "7"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "uuid"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }
