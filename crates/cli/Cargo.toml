[package]
name = "envlume"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
envlume-secrets.workspace = true
rpassword = "7.5"
zeroize = "1"
envlume-audit.workspace = true
tempfile = "3"
envlume-execution.workspace = true
envlume-toolchain.workspace = true
envlume-workspace.workspace = true
envlume-application.workspace = true
envlume-storage.workspace = true
serde_json = "1"
envlume-domain.workspace = true
envlume-mcp = { path = "../mcp" }

[dev-dependencies]
portable-pty = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled", "uuid"] }

[[test]]
name = "stdio"
harness = false

[[test]]
name = "workspace_trust"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
