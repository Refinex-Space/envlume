[package]
name = "envlume-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
envlume-application.workspace = true
envlume-domain.workspace = true
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
envlume-storage.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled", "uuid"] }
serde_json = "1"
tempfile = "3"
