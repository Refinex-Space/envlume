[package]
name = "envlume-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
pem = "3"
rustls-pki-types = "1"
rustls-webpki = {version="0.103",default-features=false,features=["std"]}
envlume-policy.workspace = true
envlume-workspace.workspace = true
envlume-domain.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[[test]]
name = "contracts"
path = "../../tests/contracts/contracts.rs"
