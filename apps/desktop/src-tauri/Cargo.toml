[package]
name = "envlume-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bundled-cli = []

[dependencies]
envlume-domain.workspace = true
serde_json = "1"
envlume-application.workspace = true
envlume-storage.workspace = true
tauri = { version = "2.12.4", features = [] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
